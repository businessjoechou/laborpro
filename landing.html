<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選擇身份｜LaborPro</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #131c13;
    --paper: #eef5ec;
    --gold: #c8901a;
    --muted: #617a5e;
    --accent: #2a6e3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 48px;
    text-align: center;
  }

  .logo span { color: var(--gold); }

  .heading {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .heading em { font-style: normal; color: var(--gold); }

  .sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 48px;
    line-height: 1.7;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 420px;
  }

  .persona-card {
    border-radius: 16px;
    padding: 28px 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .persona-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 200%; height: 200%;
    border-radius: 50%;
    opacity: 0.06;
    transition: opacity 0.3s;
  }

  .persona-card:hover { transform: translateY(-2px); }
  .persona-card:hover::before { opacity: 0.1; }

  .card-worker {
    background: linear-gradient(135deg, #1a2e1a 0%, #1e3420 100%);
    border: 1.5px solid rgba(42, 110, 62, 0.5);
  }
  .card-worker::before { background: radial-gradient(circle, var(--accent), transparent 70%); }
  .card-worker:hover { border-color: var(--accent); }

  .card-employer {
    background: linear-gradient(135deg, #2a2210 0%, #302818 100%);
    border: 1.5px solid rgba(200, 144, 26, 0.4);
  }
  .card-employer::before { background: radial-gradient(circle, var(--gold), transparent 70%); }
  .card-employer:hover { border-color: var(--gold); }

  .card-icon-bg {
    font-size: 32px;
    margin-bottom: 14px;
  }

  .card-role {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card-worker .card-role { color: rgba(42, 110, 62, 0.8); }
  .card-employer .card-role { color: rgba(200, 144, 26, 0.8); }

  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 18px;
  }

  .card-features {
    list-style: none;
    margin-bottom: 22px;
  }

  .card-features li {
    font-size: 12px;
    color: rgba(238, 245, 236, 0.65);
    line-height: 2;
    padding-left: 18px;
    position: relative;
  }

  .card-features li::before {
    content: '✓';
    position: absolute;
    left: 0;
    font-size: 11px;
  }

  .card-worker .card-features li::before { color: var(--accent); }
  .card-employer .card-features li::before { color: var(--gold); }

  .cta {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .card-worker .cta {
    background: var(--accent);
    color: #fff;
  }
  .card-worker .cta:hover { background: #225c34; }

  .card-employer .cta {
    background: var(--gold);
    color: var(--ink);
  }
  .card-employer .cta:hover { background: #b5820e; }

  .skip {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(238, 245, 236, 0.3);
    text-align: center;
  }

  .skip a {
    color: rgba(238, 245, 236, 0.4);
    text-decoration: underline;
    cursor: pointer;
  }

  .skip a:hover { color: var(--gold); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .heading { animation: fadeUp 0.5s ease both; }
  .sub { animation: fadeUp 0.5s 0.08s ease both; }
  .cards { animation: fadeUp 0.5s 0.16s ease both; }
</style>
</head>
<body>

<div class="logo">Labor<span>Pro</span></div>

<h1 class="heading">請選擇您的<em>使用身份</em></h1>
<p class="sub">我們會依據您的角色，提供最相關的計算工具與說明。</p>

<div class="cards">

  <div class="persona-card card-worker" onclick="choose('worker')">
    <div class="card-icon-bg">👷</div>
    <div class="card-role">Worker Mode</div>
    <div class="card-title">我是勞工</div>
    <div class="card-desc">了解自己的勞動權益，計算應得的資遣費、加班費、特休折現等。</div>
    <ul class="card-features">
      <li>資遣費、加班費、特休折現試算</li>
      <li>不當解雇分析與權益評估</li>
      <li>職災補償、勞保給付試算</li>
      <li>勞資爭議調解流程導引</li>
    </ul>
    <button class="cta">以勞工身份使用 →</button>
  </div>

  <div class="persona-card card-employer" onclick="choose('employer')">
    <div class="card-icon-bg">🏢</div>
    <div class="card-role">Employer Mode</div>
    <div class="card-title">我是雇主 / 人資</div>
    <div class="card-desc">確認公司合規性，試算人事成本，降低勞資爭議風險。</div>
    <ul class="card-features">
      <li>資遣成本、加班費用精算</li>
      <li>工時合規檢查與罰則速查</li>
      <li>勞退提撥試算、最低工資合規</li>
      <li>解雇合法性檢查清單</li>
    </ul>
    <button class="cta">以雇主身份使用 →</button>
  </div>

</div>

<div class="skip"><a onclick="choose('worker')">直接進入（預設勞工模式）</a></div>

<script>
function choose(persona) {
  localStorage.setItem('lp_persona', persona);
  window.location.href = 'index.html';
}

// If already chosen, skip to index
if (localStorage.getItem('lp_persona')) {
  window.location.replace('index.html');
}
</script>
</body>
</html>
