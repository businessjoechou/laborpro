<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script src="js/theme-boot.js"></script>
<script src="js/ga.js" defer></script>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的帳號｜LaborPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://labor.choulegal.com/account.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="js/supabase-config.js"></script>
<style>
  :root {
    --ink: #131c13;
    --ink-2: #1a241a;
    --paper: #eef5ec;
    --gold: #c8901a;
    --accent: #2a6e3e;
    --muted: #617a5e;
    --danger: #8b2020;
    --border: rgba(42,110,62,0.25);
  }
  *:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(238,245,236,0.08);
    position: sticky;
    top: 0;
    background: var(--ink);
    z-index: 100;
  }
  .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--paper);
    text-decoration: none;
  }
  .logo em { color: var(--gold); font-style: normal; }
  .home-link {
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    color: rgba(238,245,236,0.5);
    text-decoration: none;
    letter-spacing: 0.08em;
  }
  .home-link:hover { color: var(--gold); }

  main {
    padding: 28px 20px 40px;
    max-width: 480px;
    margin: 0 auto;
  }

  .page-title-row { margin-bottom: 24px; }
  .step-label {
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .page-title-row h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--paper);
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 22px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--paper);
    margin-bottom: 16px;
    letter-spacing: 0.04em;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed rgba(238,245,236,0.1);
  }
  .info-row:last-child { border-bottom: none; }
  .info-key {
    font-size: 13px;
    color: rgba(238,245,236,0.55);
  }
  .info-val {
    font-size: 14px;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    word-break: break-all;
    text-align: right;
    max-width: 65%;
  }

  .btn-signout {
    display: block;
    width: 100%;
    padding: 13px 20px;
    background: transparent;
    border: 1.5px solid rgba(139,32,32,0.5);
    border-radius: 10px;
    color: #e8a0a0;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-signout:hover {
    background: rgba(139,32,32,0.12);
    border-color: var(--danger);
  }

  .loading-state, .not-logged-in-card {
    text-align: center;
    padding: 60px 20px;
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(42,110,62,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p { color: rgba(238,245,236,0.5); font-size: 13px; }
  .not-logged-in-card h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    margin-bottom: 8px;
    color: var(--paper);
  }
  .not-logged-in-card p {
    font-size: 13px;
    color: rgba(238,245,236,0.55);
    margin-bottom: 20px;
  }
  .btn-to-login {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn-to-login:hover { background: #35854b; }

  .hidden { display: none !important; }

  .disclaimer-bar{max-width:560px;margin:0 auto;padding:16px 24px 72px;font-size:11.5px;color:rgba(255,255,255,0.35);line-height:1.7;border-top:1px solid rgba(255,255,255,0.08);text-align:center;}
  .disclaimer-bar strong{color:rgba(255,255,255,0.55);}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Labor<em>Pro</em></a>
  <div style="display:flex;align-items:center;gap:8px">
    <a class="home-link" href="index.html">← 返回首頁</a>
    <button id="themeToggle" type="button" aria-label="切換深色/淺色模式">☀</button>
  </div>
</header>

<main>
  <!-- Loading -->
  <div id="loading-state" class="loading-state">
    <div class="loading-spinner"></div>
    <p>正在驗證登入狀態…</p>
  </div>

  <!-- Not logged in -->
  <div id="not-logged-in" class="hidden">
    <div class="not-logged-in-card">
      <h2>尚未登入</h2>
      <p>請先登入以查看帳號資訊。</p>
      <a class="btn-to-login" href="/login.html">前往登入</a>
    </div>
  </div>

  <!-- Logged in -->
  <div id="logged-in-content" class="hidden">
    <div class="page-title-row">
      <div class="step-label">Account</div>
      <h1>我的帳號</h1>
    </div>

    <div class="card">
      <div class="card-title">帳號資訊</div>
      <div class="info-row">
        <span class="info-key">電子信箱</span>
        <span class="info-val" id="account-email">—</span>
      </div>
      <div class="info-row">
        <span class="info-key">加入日期</span>
        <span class="info-val" id="account-created">—</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">帳戶操作</div>
      <button class="btn-signout" id="btn-signout">登出</button>
    </div>
  </div>
</main>

<div class="disclaimer-bar">
  <strong>免責聲明</strong>：本平台之計算結果僅供初步參考，不構成法律意見或法律諮詢服務。
  <div style="margin-top:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    <a href="privacy.html" style="color:rgba(255,255,255,0.4);font-size:11px;text-decoration:underline;">隱私權政策</a>
    <span style="opacity:0.2;font-size:11px;">·</span>
    <a href="terms.html" style="color:rgba(255,255,255,0.4);font-size:11px;text-decoration:underline;">使用者條款</a>
    <span style="opacity:0.2;font-size:11px;">·</span>
    <span style="color:rgba(255,255,255,0.25);font-size:11px;">© 2026 LaborPro</span>
  </div>
</div>

<script type="module">
  import { supabase, signOut } from './js/auth.js';

  const $loading = document.getElementById('loading-state');
  const $notLoggedIn = document.getElementById('not-logged-in');
  const $loggedIn = document.getElementById('logged-in-content');
  const $email = document.getElementById('account-email');
  const $created = document.getElementById('account-created');
  const $signoutBtn = document.getElementById('btn-signout');

  function formatDate(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.getFullYear() + '/' +
        String(d.getMonth() + 1).padStart(2, '0') + '/' +
        String(d.getDate()).padStart(2, '0');
    } catch { return '—'; }
  }

  function renderLoggedIn(user) {
    $email.textContent = user.email || '—';
    $created.textContent = formatDate(user.created_at);
    $loading.classList.add('hidden');
    $notLoggedIn.classList.add('hidden');
    $loggedIn.classList.remove('hidden');
  }

  function renderNotLoggedIn() {
    $loading.classList.add('hidden');
    $loggedIn.classList.add('hidden');
    $notLoggedIn.classList.remove('hidden');
  }

  // Supabase 會自動處理 magic link URL hash 中的 access_token
  // 只需等待 auth 初始化完成
  supabase.auth.onAuthStateChange((event, session) => {
    if (session?.user) {
      renderLoggedIn(session.user);
    } else if (event === 'SIGNED_OUT') {
      renderNotLoggedIn();
    }
  });

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      renderLoggedIn(user);

      // 檢查是否有未完成的律師媒合申請
      const pendingRaw = localStorage.getItem('choulegal_pending_match');
      if (pendingRaw) {
        try {
          const pending = JSON.parse(pendingRaw);
          if (pending && pending.pageUrl) {
            window.location.href = pending.pageUrl;
            return;
          }
        } catch (_) {}
      }
    } else {
      renderNotLoggedIn();
    }
  })();

  $signoutBtn.addEventListener('click', async () => {
    $signoutBtn.disabled = true;
    $signoutBtn.textContent = '登出中…';
    await signOut();
  });
</script>

<script defer src="js/coffee-button.js"></script>
</body>
</html>
